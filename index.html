function buildAff(code){
  const aff=Object.fromEntries(DEFAULT_MASTERS.map(m=>[m.id,0]));for(const part of code.split('|')){const [v,list]=part.split(':');list.split(',').forEach(m=>aff[m]=+v)}
  const g=m=>aff[m]||0;
  aff.eco=Math.max(g('ete'),g('emo'),g('egr'),g('fin'),g('ecl'))>=2?1:0;  // M1 Economics → EMO/EGR/ETE/Finance/ECL
  aff.ae=Math.max(g('ppd'),g('eep'));                                        // M1 Applied Econ → PPD/EEP
  aff.l3=1;                                                                  // L3 : généraliste
  return aff;
}

const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleName=s=>String(s).trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const uid=p=>p+Math.random().toString(36).slice(2,9);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- Correspondance des noms d'entreprises ---------------- */
function findCompany(st,name){
  const k=norm(name); if(!k) return null;
  let c=st.companies.find(c=>norm(c.name)===k); if(c) return c;
  const cands=st.companies.filter(c=>{const n=norm(c.name);return n.includes(k)||k.includes(n)});
  if(cands.length===1) return cands[0];
  const fw=k.split(' ')[0];
  const c2=st.companies.filter(c=>norm(c.name).split(' ')[0]===fw);
  return c2.length===1?c2[0]:null;
}
function ensureCompany(st,name,sector){
  let c=st.companies.find(c=>norm(c.name)===norm(name));
  if(!c){const d=COMPANY_DOMAINS[norm(name)]||['',''];c={id:uid('c'),name:String(name).trim(),sector:sector||'',d1:d[0],d2:d[1],cap:1};applyCompanyAff(c);st.companies.push(c)}
  else if(sector&&!c.sector) c.sector=sector;
  return c;
}
function ensureStudent(st,name){
  const k=norm(name);let s=st.students.find(s=>s.key===k);
  if(!s){s={id:uid('s'),name:titleName(name),key:k,niveau:'',master:'',assos:[],choices:[]};st.students.push(s)}
  return s;
}

/* ---------------- Import : format synthèse (une ligne par entreprise) ---------------- */
function parseSynthesis(rows,st,keepChoices){
  const issues=[];
  const head=rows[0].map(x=>String(x??'').trim());
  const assoCols=head.map((h,i)=>({h,i})).filter(o=>o.i>=2&&o.h);
  const entries={}; // studentKey -> [{cid,rank,order,asso}]
  let order=0;
  for(const r of rows.slice(1)){
    if(!r||!r[0]) continue;
    const c=ensureCompany(st,r[0],r[1]?String(r[1]).trim():'');
    for(const {h,i} of assoCols){
      const cell=r[i]; if(cell==null||String(cell).trim()==='') continue;
      if(!st.params.assos.includes(h)) st.params.assos.push(h);
      for(const part of String(cell).split(/[,;\n]+/)){
        const p=part.trim(); if(!p) continue;
        const m=p.match(/^(.+?)\s*\((\d+)\)\s*$/);
        const name=m?m[1].trim():p, rank=m?+m[2]:null;
        const s=ensureStudent(st,name);
        if(!s.assos.some(a=>a.asso===h)) s.assos.push({asso:h,role:'membre'});
        (entries[s.key]=entries[s.key]||[]).push({cid:c.id,rank,order:order++,asso:h});
      }
    }
  }
  for(const s of st.students){
    const E=entries[s.key]; if(!E) continue;
    const best={};
    for(const e of E){const b=best[e.cid];if(!b||(e.rank??999)<(b.rank??999))best[e.cid]=e}
    const L=Object.values(best).sort((a,b)=>(a.rank??999)-(b.rank??999)||a.order-b.order);
    if(!keepChoices||!s.choices.length) s.choices=L.map(e=>e.cid);
    const nm=n=>st.companies.find(c=>c.id===n).name;
    const un=L.filter(e=>e.rank==null);
    if(un.length) issues.push({sid:s.id,msg:`${s.name} : ${un.length} vœu(x) sans numéro (${un.map(e=>nm(e.cid)).join(', ')}) placé(s) en fin de liste`});
    const rk=L.filter(e=>e.rank!=null).map(e=>e.rank);
    const dup=rk.filter((x,i)=>rk.indexOf(x)!==i);
    if(dup.length) issues.push({sid:s.id,msg:`${s.name} : numéro ${[...new Set(dup)].join(', ')} utilisé plusieurs fois, départagé par l'ordre du fichier`});
  }
  return {issues};
}

/* ---------------- Import : format formulaire (une ligne par élève) ---------------- */
function parseForm(rows,st){
  const head=rows[0].map(x=>norm(x));
  const col=re=>head.findIndex(h=>re.test(h));
  const iName=col(/^(nom|name|eleve|etudiant|prenom nom|nom prenom)/), iNiv=col(/niveau|level|annee|year/),
        iMas=col(/master|formation|parcours|programme|program/), iAsso=col(/asso/), iRole=col(/role|engagement|statut/);
  const choiceCols=head.map((h,i)=>{const m=h.match(/(choix|choice|voeu|veu|preference)\s*(n\s*)?(\d+)/);return m?{i,n:+m[3]}:null}).filter(Boolean).sort((a,b)=>a.n-b.n);
  if(iName<0) throw new Error("Colonne « Nom » introuvable dans la première ligne.");
  const issues=[];let n=0;
  for(const r of rows.slice(1)){
    const nm=r[iName]; if(!nm||!String(nm).trim()) continue; n++;
    const s=ensureStudent(st,nm);
    if(iNiv>=0&&r[iNiv]){const v=String(r[iNiv]).toUpperCase().match(/M2|M1|L3/);if(v)s.niveau=v[0]}
    if(iMas>=0&&r[iMas]){const m=matchMaster(st,r[iMas]);if(m)s.master=m.id;else issues.push({sid:s.id,msg:`${s.name} : master « ${r[iMas]} » non reconnu (ajoute-le dans Règles)`})}
    if(iAsso>=0&&r[iAsso]){
      const txt=String(r[iAsso]);
      const parts=txt.split(/[;\n]+/).map(x=>x.trim()).filter(Boolean);
      const parsed=parts.map(p=>{const m=p.match(/^(.+?)\s*[:(]\s*([^)]*)\)?$/);return m?{asso:m[1].trim(),role:matchRole(m[2])}:{asso:p,role:iRole>=0?matchRole(r[iRole]):'membre'}});
      if(parsed.length){s.assos=parsed.map(a=>({asso:matchAsso(st,a.asso),role:a.role||'membre'}))}
    } else if(iRole>=0&&r[iRole]&&s.assos.length){s.assos.forEach(a=>a.role=matchRole(r[iRole])||a.role)}
    if(choiceCols.length){
      const L=[];
      for(const {i} of choiceCols){const v=r[i];if(!v||!String(v).trim())continue;const c=findCompany(st,v);
        if(c){if(!L.includes(c.id))L.push(c.id)}else issues.push({sid:s.id,msg:`${s.name} : entreprise « ${v} » introuvable`})}
      s.choices=L;
    }
  }
  return {issues,n};
}
function matchMaster(st,v){const k=norm(v);if(!k)return null;
  return st.masters.find(m=>norm(m.label)===k)||st.masters.find(m=>norm(m.label).startsWith(k)||norm(m.id)===k)||st.masters.find(m=>norm(m.label).includes(k)||k.includes(norm(m.label.split('–')[0])))||null}
function matchRole(v){const k=norm(v);if(!k)return 'membre';if(/board|bureau|president|vice|tresor|secret|respo|head|chef/.test(k))return 'board';if(/actif|active/.test(k))return 'actif';return 'membre'}
function matchAsso(st,v){const k=norm(v);const a=st.params.assos.find(a=>norm(a)===k||norm(a).includes(k)||k.includes(norm(a)));if(a)return a;st.params.assos.push(String(v).trim());return String(v).trim()}

/* ---------------- Calcul ---------------- */
let R=null;
function compute(){
  const P=S.params, cmap=Object.fromEntries(S.companies.map(c=>[c.id,c])), mmap=Object.fromEntries(S.masters.map(m=>[m.id,m]));
  // tirage au sort reproductible
  const ids=[...S.students].sort((a,b)=>a.key<b.key?-1:1).map(s=>s.id), rng=mulberry32(+P.seed||0);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const lot=Object.fromEntries(ids.map((id,i)=>[id,i+1]));
  const eng={},lvl={};
  for(const s of S.students){const pts=s.assos.map(a=>+P.role[a.role]||0);eng[s.id]=pts.length?(P.engMode==='sum'?pts.reduce((x,y)=>x+y,0):Math.max(...pts)):0;lvl[s.id]=+P.lvl[s.niveau]||0}
  const smap=Object.fromEntries(S.students.map(s=>[s.id,s]));
  const prox=(sid,cid)=>{const s=smap[sid],m=mmap[s.master],c=cmap[cid];if(!m||!c)return 0;
    if(c.aff&&c.aff[m.id]!=null)return +c.aff[m.id];let v=0;if(c.d1)v=Math.max(v,+m.aff[c.d1]||0);if(c.d2)v=Math.max(v,(+m.aff[c.d2]||0)*0.5);return v};
  const pc={};const prio=(sid,cid)=>{const k=sid+'|'+cid;if(!(k in pc))pc[k]=(+P.wN)*lvl[sid]+(+P.wE)*eng[sid]+(+P.wP)*prox(sid,cid);return pc[k]};
  const better=(a,b,c)=>prio(b,c)-prio(a,c)||lot[a]-lot[b]; // tri décroissant
  function da(sids,lists,caps){
    const next={},held={};for(const c in caps)held[c]=[];
    const free=[...sids];sids.forEach(s=>next[s]=0);
    while(free.length){const s=free.shift();const L=lists[s]||[];if(next[s]>=L.length)continue;const c=L[next[s]++];
      if(!(c in held)||caps[c]<=0){free.unshift(s);continue}
      held[c].push(s);held[c].sort((a,b)=>better(a,b,c));if(held[c].length>caps[c])free.push(held[c].pop())}
    return held;
  }
  const caps=Object.fromEntries(S.companies.map(c=>[c.id,Math.max(0,+c.cap||0)]));
  const lists=Object.fromEntries(S.students.map(s=>[s.id,s.choices.filter(c=>c in caps)]));
  const held1=da(S.students.map(s=>s.id),lists,caps);
  const asg={};for(const c in held1)for(const s of held1[c])asg[s]={cid:c,round:1};
  let held2={};
  if(P.round2){
    const rest=S.students.filter(s=>!asg[s.id]&&s.choices.length).map(s=>s.id);
    const caps2=Object.fromEntries(S.companies.map(c=>[c.id,caps[c.id]-held1[c.id].length]));
    const open=S.companies.filter(c=>caps2[c.id]>0);
    const l2=Object.fromEntries(rest.map(sid=>[sid,[...open].sort((a,b)=>prox(sid,b.id)-prox(sid,a.id)||a.name.localeCompare(b.name)).map(c=>c.id)]));
    held2=da(rest,l2,caps2);
    for(const c in held2)for(const s of held2[c])asg[s]={cid:c,round:2};
  }
  const holders=Object.fromEntries(S.companies.map(c=>[c.id,[...held1[c.id],...(held2[c.id]||[])]]));
  for(const s of S.students){const a=asg[s.id];if(a){const i=s.choices.indexOf(a.cid);a.rank=i>=0?i+1:null}}
  // vérification de stabilité (paires bloquantes sur les vœux déclarés)
  let blocking=0;
  for(const s of S.students){const a=asg[s.id];const L=lists[s.id];const lim=a&&a.rank?a.rank-1:L.length;
    for(let i=0;i<lim;i++){const c=L[i];const H=holders[c];if(H.length<caps[c]){blocking++;continue}
      if(H.some(h=>better(s.id,h,c)<0))blocking++}}
  R={asg,holders,lot,eng,lvl,prox,prio,caps,blocking,cmap,mmap};
}

function rkChip(r,round){if(!r)return round===2?'<span class="chip warn">2ᵉ tour</span>':'<span class="rk rk0">–</span>';return `<span class="rk rk${Math.min(r,4)}">${r}</span>`}
function renderSummary(){
  const n=S.students.length, a=Object.values(R.asg), seats=Object.values(R.caps).reduce((x,y)=>x+y,0);
  const r1=a.filter(x=>x.rank===1).length, top3=a.filter(x=>x.rank&&x.rank<=3).length, none=n-a.length;
  const pct=x=>n?Math.round(100*x/n)+' %':'–';
  const missing=S.students.filter(s=>!s.niveau||!s.master).length;
  document.getElementById('summary').innerHTML=[
    [n,'élèves'],[seats,'places ('+S.companies.length+' entreprises)'],[pct(r1),'ont leur choix n° 1'],[pct(top3),'ont un choix du top 3'],[none,'sans parrainage'],[missing,'fiches incomplètes']
  ].map(([v,l])=>`<div><span class="v">${v}</span><span class="l">${l}</span></div>`).join('');
  const buckets=[['1',x=>x.rank===1,'var(--accent)'],['2',x=>x.rank===2,'var(--r2)'],['3',x=>x.rank===3,'var(--r3)'],['4 et +',x=>x.rank>=4,'var(--r4)'],['2ᵉ tour',x=>x.round===2&&!x.rank,'var(--warn)']];
  const counts=buckets.map(([l,f,c])=>[l,a.filter(f).length,c]);counts.push(['aucun',none,'var(--bad)']);
  document.getElementById('distbar').innerHTML=counts.filter(c=>c[1]).map(([l,k,c])=>`<span style="width:${100*k/Math.max(n,1)}%;background:${c}" title="${l} : ${k}"></span>`).join('');
  document.getElementById('distLegend').innerHTML=counts.map(([l,k,c])=>`<span><i style="background:${c}"></i>${l} · <span class="num">${k}</span></span>`).join('');
  document.getElementById('stabBadge').innerHTML=R.blocking===0?'<span class="chip ok">✓ Affectation stable · 0 paire bloquante</span>':`<span class="chip bad">${R.blocking} paire(s) bloquante(s)</span>`;
}

function masterShort(s){const m=R.mmap[s.master];return m?esc(m.label.split(' – ')[0]):'<span class="chip warn">master ?</span>'}

function shortAsso(a){return({'Bureau Des Étudiants':'BDE','Bureau Des Sports':'BDS','Junior Etudes':'JE'})[a]||a}

function explainCard(sid){
  const s=S.students.find(x=>x.id===sid); if(!s) return '';
  const a=R.asg[s.id];
  const items=s.choices.map((cid,i)=>{
    const me=R.prio(s.id,cid), H=R.holders[cid]||[], cap=R.caps[cid];
    let out;
    if(a&&a.cid===cid) out='<span class="chip ok">obtenu</span>';
    else if(a&&a.rank&&i+1>a.rank) out='<span class="muted">non utilisé (un vœu mieux classé a été obtenu)</span>';
    else if(cap===0) out='<span class="chip bad">aucune place ouverte</span>';
    else{const last=H[H.length-1];const tie=R.prio(last,cid)===me;
      out=`pris par ${H.map(h=>`<b>${esc(sname(h))}</b> <span class="num">(${fmt(R.prio(h,cid))})</span>`).join(', ')}${tie?' · égalité départagée par le tirage':''}`}
    return `<li>${rkChip(i+1)} <b>${esc(cname(cid))}</b> · ta priorité <span class="num">${fmt(me)}</span> = ${fmtDetail(s.id,cid)}<br>${out}</li>`}).join('');
  return `<div class="card">
    <div class="row"><h2>${esc(s.name)}</h2>${niveauChip(s)}${s.master?`<span class="chip">${masterShort(s)}</span>`:masterShort(s)}<span class="spacer"></span><button class="btn ghost" data-act="unsel">Fermer</button></div>
    <div>${a?`Affecté·e à <b>${esc(cname(a.cid))}</b> ${a.rank?`(vœu n° ${a.rank})`:'(2ᵉ tour, entreprise avec places restantes la plus proche de sa formation)'}`:'<b>Aucune affectation</b> : tous ses vœux sont pris par des élèves prioritaires.'}</div>
    <ol class="plain explain" style="list-style:none;padding:0">${items||'<li class="muted">Aucun vœu saisi.</li>'}</ol>
    <p class="note">Tirage au sort : n° <span class="num">${R.lot[s.id]}</span> (sert seulement à départager deux priorités égales).</p></div>`;
}
const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(1);

function levelStats(){
  const groups=[...NIVEAUX,''].map(n=>{const g=S.students.filter(s=>s.niveau===n);if(!g.length)return null;
    const a=g.map(s=>R.asg[s.id]).filter(Boolean);
    const prox=g.filter(s=>R.asg[s.id]).map(s=>R.prox(s.id,R.asg[s.id].cid));
    const pct=v=>Math.round(100*v/g.length)+' %';
    return [n||'?',g.length,pct(a.filter(x=>x.rank===1).length),pct(a.filter(x=>x.rank&&x.rank<=3).length),g.length-a.length,a.filter(x=>x.round===2).length,prox.length?(prox.reduce((x,y)=>x+y,0)/prox.length).toFixed(2):'–']}).filter(Boolean);
  if(groups.length<2&&groups[0]&&groups[0][0]==='?')return '';
  return `<div class="tablebox"><table><thead><tr><th>Niveau</th><th class="r">Élèves</th><th class="r">Choix n° 1</th><th class="r">Top 3</th><th class="r">Sans parrainage</th><th class="r">Placés au 2ᵉ tour</th><th class="r">Proximité moy. (0–2)</th></tr></thead><tbody>

}

function makeFake(st,n,K,seed){
  const rng=mulberry32(seed), pick=a=>a[Math.floor(rng()*a.length)], gumbel=()=>-Math.log(-Math.log(rng()+1e-12)+1e-12);
  const pop=Object.fromEntries(st.companies.map(c=>[c.id,Math.log1p(POP[norm(c.name)]||0)]));
  const out=[];
  for(let i=0;i<n;i++){
    const u=rng(), niveau=u<.4?'M2':u<.75?'M1':'L3';
    const master=niveau==='M2'?pick(M2_POOL):niveau==='M1'?pick(M1_POOL):'l3';
    const m=st.masters.find(x=>x.id===master);
    const nA=rng()<.15?2:1, assos=[];
    while(assos.length<nA){const a=pick(st.params.assos);if(!assos.some(x=>x.asso===a)){const r=rng();assos.push({asso:a,role:r<.2?'board':r<.55?'actif':'membre'})}}
    const util=st.companies.map(c=>[c.id,pop[c.id]+1.2*(m?compAff(c,m):0)+0.7*gumbel()]).sort((a,b)=>b[1]-a[1]);
    const name=FAKE_NAMES[i%FAKE_NAMES.length]+' '+LETTERS[(i*7)%LETTERS.length]+'.';
    out.push({id:uid('f'),name,key:norm(name)+' '+i,niveau,master,assos,choices:util.slice(0,K).map(x=>x[0])});
  }
  return out;
}

/* ---------------- Exports ---------------- */
async function offer(filename,data){
  try{const d=await (window.claude?.use?window.claude.use('downloads'):null);
    if(!d){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Fichier téléchargé');return}
    await d.save({filename,data});toast('Fichier enregistré')}
  catch(e){if(e&&e.code==='declined')return;toast("Le téléchargement n'a pas abouti : "+(e&&e.message||e))}
}
function wbToBuf(sheets){const wb=XLSX.utils.book_new();for(const [n,aoa,w] of sheets){const ws=XLSX.utils.aoa_to_sheet(aoa);if(w)ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)}return XLSX.write(wb,{type:'array',bookType:'xlsx'})}
const mlabel=id=>(S.masters.find(m=>m.id===id)||{}).label||'';
const roleLabel=r=>(ROLES.find(x=>x.id===r)||{}).label||r;
function resultRows(){
  return [['Élève','Niveau','Master','Engagement','Entreprise attribuée','Rang du vœu','Tour','Priorité'],
   ...[...S.students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{const a=R.asg[s.id];return [s.name,s.niveau,mlabel(s.master),R.eng[s.id],a?cname(a.cid):'—',a&&a.rank?a.rank:'',a?a.round:'',a?R.prio(s.id,a.cid):'']})];
}
function dlResult(){
  const byC=[['Entreprise','Capacité','Élèves attribués','Places libres'],...S.companies.map(c=>[c.name,R.caps[c.id],R.holders[c.id].map(sname).join(', '),R.caps[c.id]-R.holders[c.id].length])];
  const det=[['Élève','Rang','Entreprise','Niveau','Engagement','Proximité','Priorité','Tirage','Issue']];
  for(const s of S.students){const a=R.asg[s.id];s.choices.forEach((c,i)=>det.push([s.name,i+1,cname(c),R.lvl[s.id],R.eng[s.id],R.prox(s.id,c),R.prio(s.id,c),R.lot[s.id],a&&a.cid===c?'obtenu':(a&&a.rank&&i+1>a.rank?'non utilisé':'pris par '+R.holders[c].map(sname).join(', '))]))}
  offer('parrainages_BND_2026_resultats.xlsx',wbToBuf([['Affectations',resultRows(),[22,8,40,11,40,11,6,9]],['Par entreprise',byC,[45,9,40,11]],['Détail des vœux',det,[22,6,40,7,11,10,9,7,40]]]));
}
function dlTemplate(){
  const K=Math.max(8,...S.students.map(s=>s.choices.length));
  const head=['Nom','Niveau','Master','Associations',...Array.from({length:K},(_,i)=>'Choix '+(i+1))];
  const rows=[...S.students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.name,s.niveau,mlabel(s.master),s.assos.map(a=>`${a.asso}: ${roleLabel(a.role)}`).join('; '),...Array.from({length:K},(_,i)=>s.choices[i]?cname(s.choices[i]):'')]);
  const L=Math.max(S.masters.length,S.companies.length,S.params.assos.length);
  const vals=[['Niveau','Master','Association','Rôle','Entreprise'],...Array.from({length:L},(_,i)=>[NIVEAUX[i]||'',S.masters[i]?.label||'',S.params.assos[i]||'',ROLES[i]?.label||'',[...S.companies].sort((a,b)=>a.name.localeCompare(b.name))[i]?.name||''])];
  offer('parrainages_BND_2026_eleves.xlsx',wbToBuf([['Élèves',[head,...rows],[22,8,40,40,...Array(K).fill(28)]],['Valeurs',vals,[8,45,24,14,50]]]));
}
function copyResult(){const t=resultRows().map(r=>r.join('\t')).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Tableau copié : colle-le dans Excel')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Tableau copié')}catch(e){toast('Copie impossible')}ta.remove()})}

/* ---------------- Événements ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sel],[data-act]'); if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.sel){sel=sel===t.dataset.sel&&tab==='resultat'?null:t.dataset.sel;render();window.scrollTo({top:document.getElementById('tabs').offsetTop-8,behavior:'smooth'});return}
  const act=t.dataset.act, s=S.students.find(x=>x.id===sel), i=+t.dataset.i;
  switch(act){
    case 'unsel':sel=null;break;
    case 'up':if(s&&i>0)[s.choices[i-1],s.choices[i]]=[s.choices[i],s.choices[i-1]];break;
    case 'down':if(s&&i<s.choices.length-1)[s.choices[i+1],s.choices[i]]=[s.choices[i],s.choices[i+1]];break;
    case 'rmChoice':if(s)s.choices.splice(i,1);break;
    case 'addChoice':{const v=document.getElementById('ed-add')?.value;if(s&&v)s.choices.push(v);break}
    case 'addAsso':{const v=document.getElementById('ed-asso')?.value;if(s&&v)s.assos.push({asso:v,role:'membre'});break}
    case 'delAsso':if(s)s.assos.splice(i,1);break;
    case 'delStudent':if(s){S.students=S.students.filter(x=>x!==s);sel=null;toast(s.name+' supprimé·e')}break;
    case 'addStudent':{const n={id:uid('s'),name:'Nouvel élève',key:'nouvel eleve '+Date.now(),niveau:'',master:'',assos:[],choices:[]};S.students.push(n);sel=n.id;break}
    case 'bulkLevel':S.students.forEach(x=>{if(!x.niveau)x.niveau='M1'});toast('Niveaux manquants mis à M1');break;
    case 'capAll':{const v=Math.max(0,+document.getElementById('capAll').value||0);S.companies.forEach(c=>c.cap=v);break}
    case 'addCompany':S.companies.push({id:uid('c'),name:'Nouvelle entreprise',sector:'',d1:'',d2:'',cap:1});toast('Ajoutée en bas du tableau (0 demande)');break;
    case 'delCompany':{const id=t.dataset.id;S.companies=S.companies.filter(c=>c.id!==id);S.students.forEach(x=>x.choices=x.choices.filter(c=>c!==id));break}
    case 'addMaster':S.masters.push({id:uid('m'),label:'Nouveau master',aff:{}});break;
    case 'delMaster':{const id=t.dataset.id;S.masters=S.masters.filter(m=>m.id!==id);S.students.forEach(x=>{if(x.master===id)x.master=''});break}
    case 'cycle':{const c=S.companies.find(x=>x.id===t.dataset.c),m=S.masters.find(x=>x.id===t.dataset.m);if(!c||!m)return;c.aff=c.aff||{};c.aff[m.id]=(Math.round(compAff(c,m))+1)%3;
      render();const b=document.querySelector(`[data-act="cycle"][data-c="${c.id}"][data-m="${m.id}"]`);if(b)b.focus({preventScroll:true});return}
    case 'fake':{const n=Math.max(1,Math.min(300,+document.getElementById('fk-n').value||40)),K=Math.max(1,+document.getElementById('fk-k').value||6),sd=+document.getElementById('fk-seed').value||1;
      S.students=makeFake(S,n,K,sd);S.fake={n,K,seed:sd};S.imports=[];sel=null;tab='resultat';toast(n+' élèves fictifs générés');break}
    case 'dlResult':dlResult();return;
    case 'dlTemplate':dlTemplate();return;
    case 'copyResult':copyResult();return;
    case 'dlJson':offer('parrainages_BND_2026_config.json',JSON.stringify(S,null,1));return;
    case 'reset':document.getElementById('resetConfirm').innerHTML='<div class="row"><span>Toutes les modifications seront perdues.</span><button class="btn danger" data-act="resetYes">Confirmer</button></div>';return;
    case 'resetYes':S=freshState();sel=null;toast('Démo de départ rechargée');break;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.f){const s=S.students.find(x=>x.id===d.id);if(!s)return;
    if(d.f==='role')s.assos[+d.i].role=t.value;else s[d.f]=t.value;}
  else if(d.cf){const c=S.companies.find(x=>x.id===d.id);c[d.cf]=d.cf==='cap'?Math.max(0,+t.value||0):t.value}
  else if(d.p){S.params[d.p]=d.p==='engMode'?t.value:(+t.value||0)}
  else if(d.lvl){S.params.lvl[d.lvl]=+t.value||0}
  else if(d.role){S.params.role[d.role]=+t.value||0}
  else if(d.m){S.masters.find(m=>m.id===d.m).aff[d.d]=+t.value}
  else if(d.ml){S.masters.find(m=>m.id===d.ml).label=t.value}
  else if(t.id==='round2'){S.params.round2=t.checked}
  else if(t.id==='ed-name'){const s=S.students.find(x=>x.id===sel);if(s&&t.value.trim()){s.name=t.value.trim();s.key=norm(s.name)}}
  else if(t.id==='fileIn'){importFile(t.files[0]);return}
  else if(t.id==='jsonIn'){importJson(t.files[0]);return}
  else return;
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='sfilter'){studentFilter=e.target.value;const pos=e.target.selectionStart;render();const f=document.getElementById('sfilter');f.focus();f.setSelectionRange(pos,pos)}});

function importFile(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false}).filter(r=>r.some(x=>x!=null&&String(x).trim()!==''));
    if(!rows.length)throw new Error('Fichier vide.');
    if(S.fake){S.students=[];S.fake=null}
    const h0=norm(rows[0][0]);let rep;
    if(/entreprise|institution|company/.test(h0)){const r=parseSynthesis(rows,S,false);S.imports=r.issues;rep=`Synthèse importée : ${rows.length-1} entreprises lues.`}
    else{const r=parseForm(rows,S);S.imports=r.issues;rep=`${r.n} élèves importés ou mis à jour.`}
    tab='donnees';render();
    document.getElementById('importReport').innerHTML=`<div class="chip ok">${esc(rep)}</div>${S.imports.length?`<ul style="margin:8px 0 0;padding-left:18px;font-size:13px">${S.imports.map(i=>`<li>${esc(i.msg)}</li>`).join('')}</ul>`:''}`;
  }catch(err){document.getElementById('importReport').innerHTML=`<span class="chip bad">Import impossible : ${esc(err.message||err)}</span>`}};
  rd.readAsArrayBuffer(f);
}
function importJson(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s.companies||!s.students||!s.params)throw new Error('format inattendu');S=s;sel=null;tab='resultat';render();toast('Configuration importée')}catch(e){toast('Fichier de configuration invalide : '+e.message)}};rd.readAsText(f)}

/* ---------------- Démarrage ---------------- */
S=load()||freshState();
S.companies.forEach(applyCompanyAff);
render();
</script>
